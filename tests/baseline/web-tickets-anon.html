<!doctype html>
<html>
    <body>
        <!--$-->
        <header class="web-header">
            <div class="web-header__inner">
                <a class="web-header__brand" aria-label="IPstress — home" href="/web"
                    ><span class="web-header__mark" aria-hidden="true"
                        ><svg
                            width="22"
                            height="22"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2.2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path d="M13 2 3 14h7l-1 8 10-12h-7l1-8Z"></path></svg></span
                    ><span class="web-header__name">IPstress</span></a
                >
                <nav class="web-header__nav" aria-label="Primary">
                    <ul>
                        <li><a href="/web">Home</a></li>
                        <li><a href="/web#about">About</a></li>
                        <li><a href="/web#plans">Plans</a></li>
                        <li><a href="/web#faq">FAQ</a></li>
                    </ul>
                </nav>
                <div class="web-header__cta">
                    <a class="web-header__btn web-header__btn--ghost" href="/web/register"

                    ><a class="web-header__btn web-header__btn--solid" href="/web/login">Log in</a>
                </div>
            </div>
        </header>
        <!--$-->
        <div class="page-breadcrumb">
            <div class="d-flex align-items-center">
                <h4 class="page-title text-truncate text-white font-weight-medium mb-0">
                    Support Tickets
                </h4>
                <div class="ml-auto">
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb m-0 p-0">
                            <li class="breadcrumb-item text-sql" aria-current="page">IPstress</li>
                            <li class="breadcrumb-item text-muted" aria-current="page">Tickets</li>
                        </ol>
                    </nav>
                </div>
            </div>
        </div>
        <div class="container-fluid">
            <div class="row">
                <div class="col-12">
                    <div class="card">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <h4 class="card-title">My Tickets</h4>
                                <a class="btn btn-primary" href="/web/tickets/new">New Ticket</a>
                            </div>
                            <div class="table-responsive">
                                <table class="table table-striped">
                                    <thead>
                                        <tr>
                                            <th>ID</th>
                                            <th>Subject</th>
                                            <th>Status</th>
                                            <th>Date</th>
                                            <th>Action</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <td colspan="5" class="text-center text-muted">
                                                Loading tickets...
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
