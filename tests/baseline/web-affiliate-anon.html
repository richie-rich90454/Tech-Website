<!doctype html>
<html>
    <body>
        <!--$-->
        <header class="web-header">
            <div class="web-header__inner">
                <a class="web-header__brand" aria-label="IPstress — home" href="/web"
                    ><span class="web-header__mark" aria-hidden="true"
                        ><svg
                            width="22"
                            height="22"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2.2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path d="M13 2 3 14h7l-1 8 10-12h-7l1-8Z"></path></svg></span
                    ><span class="web-header__name">IPstress</span></a
                >
                <nav class="web-header__nav" aria-label="Primary">
                    <ul>
                        <li><a href="/web">Home</a></li>
                        <li><a href="/web#about">About</a></li>
                        <li><a href="/web#plans">Plans</a></li>
                        <li><a href="/web#faq">FAQ</a></li>
                    </ul>
                </nav>
                <div class="web-header__cta">
                    <a class="web-header__btn web-header__btn--ghost" href="/web/register"
                        >Register</a
                    ><a class="web-header__btn web-header__btn--solid" href="/web/login">Log in</a>
                </div>
            </div>
        </header>
        <!--$-->
        <div class="page-breadcrumb">
            <div class="d-flex align-items-center">
                <h4 class="page-title text-truncate text-white font-weight-medium mb-0">
                    Affiliate
                </h4>
                <div class="ml-auto">
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb m-0 p-0">
                            <li class="breadcrumb-item text-sql" aria-current="page">IPstress</li>
                            <li class="breadcrumb-item text-muted" aria-current="page">
                                Affiliate
                            </li>
                        </ol>
                    </nav>
                </div>
            </div>
        </div>
        <div class="container-fluid">
            <div class="row">
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-body">
                            <h4 class="card-title">Affiliate Stats</h4>
                            <div class="mt-4 activity">
                                <p class="text-muted">Loading stats...</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-body">
                            <h4 class="card-title">Withdraw Balance</h4>
                            <div class="mt-4 activity">
                                <form>
                                    <div class="form-group">
                                        <label class="text-white" for="paymentMethod"
                                            >Payment Method</label
                                        ><select
                                            class="form-control"
                                            id="paymentMethod"
                                            required=""
                                        >
                                            <option value="" selected="">Select method...</option>
                                            <option value="BTC">Bitcoin (BTC)</option>
                                            <option value="LTC">Litecoin (LTC)</option>
                                            <option value="ETH">Ethereum (ETH)</option>
                                            <option value="PayPal">PayPal</option>
                                        </select>
                                    </div>
                                    <div class="form-group">
                                        <label class="text-white" for="paymentAddress"
                                            >Payment Address</label
                                        ><input
                                            class="form-control"
                                            id="paymentAddress"
                                            type="text"
                                            placeholder="Enter your wallet address or email"
                                            required=""
                                            value=""
                                        />
                                    </div>
                                    <div class="form-group">
                                        <label class="text-white" for="amount">Amount (¥)</label
                                        ><input
                                            class="form-control"
                                            id="amount"
                                            type="number"
                                            placeholder="Enter amount to withdraw"
                                            min="1"
                                            required=""
                                            value=""
                                        />
                                    </div>
                                    <button type="submit" class="btn btn-primary btn-block">
                                        Request Withdrawal
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!--/$--><!--/$-->
    </body>
</html>
